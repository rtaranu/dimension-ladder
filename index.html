<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dimension Ladder</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #hint {
      position: fixed; left: 16px; top: 12px; color: #aab4c5;
      font: 14px/1.5 system-ui, sans-serif; pointer-events: none;
    }
    #hint b { color: #e8ecf4; font-weight: 600; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">
    <b>Dimension Ladder</b><br>
    Drag a knob to turn it · drag elsewhere to look around<br>
    M: change view · Space: auto-spin · R: reset knobs
  </div>
  <!-- A fresh address on every load, so the browser never reuses a stale copy of the app. -->
  <script type="module">
    const stamp = Date.now();
    window.__stamp = stamp;
    import(`./src/main.js?t=${stamp}`);
  </script>
</body>
</html>
